---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: secret-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: secret-demo

  template:
    metadata:
      labels:
        app: secret-demo

    spec:
      containers:
        - name: secret-demo
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - sleep 3600

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: password