apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-redis
  namespace: equipment-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: equipment-redis
  template:
    metadata:
      labels:
        app: equipment-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-redis
  namespace: equipment-monitor
spec:
  selector:
    app: equipment-redis
  ports:
    - port: 6379
      targetPort: 6379
