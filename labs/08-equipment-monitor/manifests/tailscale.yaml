apiVersion: v1
kind: Service
metadata:
  name: equipment-monitor-tailscale
  namespace: equipment-monitor
  annotations:
    tailscale.com/hostname: equipment-monitor
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: equipment-monitor
  ports:
    - name: http
      port: 80
      targetPort: 5000
