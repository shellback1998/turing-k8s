apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-monitor
  namespace: equipment-monitor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: equipment-monitor
  template:
    metadata:
      labels:
        app: equipment-monitor
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: equipment-monitor
          image: 192.168.8.191:5000/equipment-monitor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: equipment-monitor-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-monitor
  namespace: equipment-monitor
spec:
  selector:
    app: equipment-monitor
  ports:
    - port: 80
      targetPort: 5000
