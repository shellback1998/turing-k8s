---
# Scott Academy Linux labs: one-time cluster setup and image pre-pull.
#
#   Preview (no changes):  ansible-playbook playbooks/academy-labs.yml --check --diff
#   Apply:                 ansible-playbook playbooks/academy-labs.yml
#   Pre-pull a new image:  ansible-playbook playbooks/academy-labs.yml --tags prepull -e academy_lab_image_tag=<tag>
#
# Creates only the academy-labs namespace and what's inside it (see academy-labs/cluster-setup.yaml).
# It deletes nothing except the unused academy-lab-viewer service account from the first version.
# Removing the labs is `kubectl delete namespace academy-labs`.

- name: Apply the academy-labs namespace, limits, network rules and RBAC
  hosts: k8s_manager
  gather_facts: false
  tags: [cluster]

  vars:
    manifest: "{{ playbook_dir }}/../academy-labs/cluster-setup.yaml"

  tasks:
    - name: Confirm kubectl reaches the cluster
      ansible.builtin.command: kubectl get nodes -o name
      register: nodes
      changed_when: false
      check_mode: false

    - name: Check that the cluster enforces NetworkPolicy (K3s network policy controller)
      ansible.builtin.command: kubectl api-resources --api-group=networking.k8s.io -o name
      register: netapi
      changed_when: false
      check_mode: false
      failed_when: "'networkpolicies.networking.k8s.io' not in netapi.stdout"

    - name: Check whether academy-labs already exists
      ansible.builtin.command: kubectl get namespace academy-labs -o name
      register: ns
      changed_when: false
      failed_when: false
      check_mode: false

    # First run: kubectl diff can't preview objects inside a namespace that doesn't exist yet,
    # so list what would be created instead (client-side dry run; nothing is sent to be stored).
    - name: Preview first-time setup (nothing is created)
      ansible.builtin.command: kubectl apply --dry-run=client -f {{ manifest }} -o name
      register: first_preview
      changed_when: true
      check_mode: false
      when: ns.rc != 0

    - name: Preview changes to the existing setup (server-side dry run)
      ansible.builtin.command: kubectl diff --server-side -f {{ manifest }}
      register: diff
      changed_when: diff.rc == 1
      failed_when: diff.rc > 1
      check_mode: false
      when: ns.rc == 0

    - name: Show the preview
      ansible.builtin.debug:
        msg: "{{ (first_preview.stdout_lines | default([])) if ns.rc != 0 else ((diff.stdout_lines | default([])) or ['No changes']) }}"

    - name: Apply
      ansible.builtin.command: kubectl apply --server-side -f {{ manifest }}
      register: applied
      changed_when: ns.rc != 0 or diff.rc == 1
      when: not ansible_check_mode and (ns.rc != 0 or diff.rc == 1)

    - name: Remove the viewer service account from the first version (the viewer now uses a certificate)
      ansible.builtin.command: kubectl -n academy-labs delete serviceaccount academy-lab-viewer --ignore-not-found
      register: oldsa
      changed_when: "'deleted' in oldsa.stdout"
      when: not ansible_check_mode

    - name: Verify the controller can only act inside academy-labs
      ansible.builtin.command: >-
        kubectl auth can-i {{ item.verb }} {{ item.resource }}
        --as=system:serviceaccount:academy-labs:academy-lab-controller -n {{ item.ns }}
        {{ ('--subresource=' ~ item.sub) if item.sub is defined else '' }}
      loop:
        - { verb: create, resource: pods, ns: academy-labs, expect: "yes" }
        - { verb: delete, resource: pods, ns: academy-labs, expect: "yes" }
        - { verb: create, resource: pods, ns: default, expect: "no" }
        - { verb: create, resource: services, ns: academy-labs, expect: "no" }
        - { verb: create, resource: pods, sub: exec, ns: academy-labs, expect: "no" }
        - { verb: get, resource: secrets, ns: academy-labs, expect: "no" }
        - { verb: delete, resource: namespaces, ns: academy-labs, expect: "no" }
      register: cani
      changed_when: false
      failed_when: cani.stdout != item.expect
      when: not ansible_check_mode

- name: Pre-pull the lab image on the Turing Pi workers
  hosts: turing_workers
  become: true
  gather_facts: false
  tags: [prepull]

  vars:
    academy_lab_image: "192.168.8.191:5000/academy-lab-linux:{{ academy_lab_image_tag }}"

  tasks:
    - name: Require an explicit image tag
      ansible.builtin.assert:
        that: academy_lab_image_tag is defined and academy_lab_image_tag | length > 0
        fail_msg: "Pass -e academy_lab_image_tag=<tag>"
      run_once: true
      delegate_to: localhost

    - name: Check free disk space (nodes 02-07 are tight)
      ansible.builtin.shell: df --output=avail -BM /var/lib/rancher | tail -1 | tr -dc '0-9'
      register: free_mb
      changed_when: false
      check_mode: false
      failed_when: free_mb.stdout | int < 800

    - name: Pull the image into containerd
      ansible.builtin.command: k3s crictl pull {{ academy_lab_image }}
      register: pull
      changed_when: "'Image is up to date' in pull.stdout or 'sha256:' in pull.stdout"
      when: not ansible_check_mode
