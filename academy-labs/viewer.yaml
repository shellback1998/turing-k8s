# Scott Academy lab viewer: Apache Guacamole 1.6.0 (guacd + web app), served at /viewer.
# Sign-in is only by short-lived, encrypted JSON links that the Academy server creates
# (guacamole-auth-json); there are no Guacamole user accounts or passwords.
# The JSON key lives in Secret academy-viewer-json (created by playbooks/academy-viewer.yml, never in Git).
apiVersion: v1
kind: Namespace
metadata:
  name: academy-viewer
  labels:
    app.kubernetes.io/part-of: scott-academy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: academy-viewer
spec:
  replicas: 1
  selector: { matchLabels: { app: guacd } }
  template:
    metadata: { labels: { app: guacd } }
    spec:
      automountServiceAccountToken: false
      # guacd makes the connections: it must run on k8s-manager, the node on the tailnet, to
      # reach Windows lab VMs over Tailscale (RDP). Pod traffic leaves through the node's tailscale0.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports: [{ containerPort: 4822 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: academy-viewer
spec:
  selector: { app: guacd }
  ports: [{ port: 4822, targetPort: 4822 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: academy-viewer
spec:
  replicas: 1
  selector: { matchLabels: { app: guacamole } }
  template:
    metadata: { labels: { app: guacamole } }
    spec:
      automountServiceAccountToken: false
      # Infrastructure, not a lab: prefer k8s-manager (amd64, most disk and memory) over the Pi workers.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          env:
            - { name: GUACD_HOSTNAME, value: guacd }
            - { name: WEBAPP_CONTEXT, value: viewer }
            - name: JSON_SECRET_KEY
              valueFrom: { secretKeyRef: { name: academy-viewer-json, key: key } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /viewer/, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false }
---
# Reached by the Cloudflare Tunnel and the Academy server on turing-manager at <any node>:30880.
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: academy-viewer
spec:
  type: NodePort
  selector: { app: guacamole }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30880 }]
